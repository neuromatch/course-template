name: Generate Notebooks

on:
  push:
    branches: [main]
    paths:
      - "tutorials/**"
      - "scripts/convert_to_notebooks.py"
      - "myst.yml"
      - "requirements.txt"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Convert tutorials to notebooks
        run: uv run python scripts/convert_to_notebooks.py

      - name: Push notebooks to notebooks-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git worktree add /tmp/notebooks-branch notebooks-branch

          rsync -av --delete notebooks/ /tmp/notebooks-branch/notebooks/

          cd /tmp/notebooks-branch
          git add notebooks/
          if git diff --cached --quiet; then
            echo "No notebook changes to push."
          else
            git commit -m "chore: regenerate notebooks from main@${{ github.sha }}"
            git push origin notebooks-branch
          fi
