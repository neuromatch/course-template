name: Publish Book

on:
  # Rebuild when non-tutorial files change (theme, config, static assets)
  push:
    branches: [main]
    paths:
      - "myst.yml"
      - "requirements.txt"
      - "_static/**"
      - "projects/**"
  # Rebuild after notebook generation completes (tutorial content changes)
  workflow_run:
    workflows: ["Generate Notebooks"]
    types: [completed]
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Build MyST book
        run: uv run myst build --html
        env:
          BASE_URL: /${{ github.event.repository.name }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
