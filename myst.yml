version: 1
project:
  title: Neuromatch Course Template
  authors:
    - name:
        literal: Neuromatch
      github: neuromatch
  github: https://github.com/neuromatch/course-template
  license:
    code: BSD-3-Clause
    content: CC-BY-4.0
  jupyter:
