version: 1
# The Neuromatch course kit: adds the MyST plugin ({nma-video}, {nma-solution},
# editable cells, scrolly pages, ...) and turns on JupyterLite. @0.1 = newest
# 0.1.x; CI pins it to the exact version of the workflow's kit release.
extend: https://cdn.jsdelivr.net/npm/@neuromatch/course-kit@0.1/dist/nma.yml
project:
  title: Neuromatch Course Template
  authors:
    - name:
        literal: Neuromatch
      github: neuromatch
  github: https://github.com/neuromatch/course-template
  license:
    code: BSD-3-Clause
    content: CC-BY-4.0
  toc:
    - file: tutorials/intro.md
    - file: tutorials/W1D1_GettingStarted/chapter_intro.md
      children:
        - file: tutorials/W1D1_GettingStarted/W1D1_Tutorial1.md
        - file: tutorials/W1D1_GettingStarted/W1D1_Tutorial2.md
        - file: tutorials/W1D1_GettingStarted/W1D1_Tutorial3.md
        - file: tutorials/W1D1_GettingStarted/W1D1_Tutorial4.md
        - file: tutorials/W1D1_GettingStarted/W1D1_Bonus.md
        - file: tutorials/W1D1_GettingStarted/further_reading.md
    - file: tutorials/W1D2_InteractiveContent/chapter_intro.md
      children:
        - file: tutorials/W1D2_InteractiveContent/W1D2_Tutorial1.md
        - file: tutorials/W1D2_InteractiveContent/W1D2_Tutorial2.md
        - file: tutorials/W1D2_InteractiveContent/W1D2_Tutorial3.md
        - file: tutorials/W1D2_InteractiveContent/W1D2_Tutorial4.md
        - file: tutorials/W1D2_InteractiveContent/W1D2_Tutorial5.md
        - file: tutorials/W1D2_InteractiveContent/W1D2_Tutorial6.md
        - file: tutorials/W1D2_InteractiveContent/W1D2_Tutorial7.md
        - file: tutorials/W1D2_InteractiveContent/W1D2_Bonus.md
        - file: tutorials/W1D2_InteractiveContent/further_reading.md
    - file: tutorials/W1D3_PublishingAndCI/chapter_intro.md
      children:
        - file: tutorials/W1D3_PublishingAndCI/W1D3_Tutorial1.md
        - file: tutorials/W1D3_PublishingAndCI/W1D3_Tutorial2.md
        - file: tutorials/W1D3_PublishingAndCI/W1D3_Tutorial3.md
        - file: tutorials/W1D3_PublishingAndCI/W1D3_Bonus.md
        - file: tutorials/W1D3_PublishingAndCI/further_reading.md
    - file: tutorials/W2D1_Examples/chapter_intro.md
      children:
        - file: tutorials/W2D1_Examples/W2D1_Tutorial1.md
        - file: tutorials/W2D1_Examples/W2D1_Tutorial2.md
        - file: tutorials/W2D1_Examples/W2D1_Tutorial3.md
        - file: tutorials/W2D1_Examples/further_reading.md
    - file: projects/README.md
      children:
        - file: projects/project_guidance.md
        - file: projects/example_macrocircuits/Macrocircuits.md
        - file: projects/example_neurons/README.md
          children:
            - file: projects/example_neurons/allen_visual_behavior.md

site:
  template: book-theme
  options:
    folders: true
    logo_text: Neuromatch Course Template   # your course's name next to the logo
    # The kit's branding (stylesheet, Rubik font, logos, favicon), written to
    # _nma/ by `nma-kit sync-assets` (CI runs it for you; the folder is not committed).
    style: _nma/site.css
    logo: _nma/logo.svg
    logo_dark: _nma/logo-dark.svg
    favicon: _nma/favicon.png

# Neuromatch settings. Read by the course kit (plugin and nma-kit CLI), not by MyST
# (MyST logs "extra key ignored: nma", which is expected).
# Use `key: value` entries with string values; `nma-kit check` rejects numbers, lists and deeper nesting.
nma:
  # Branding (optional). Override the kit's colours and/or append your own CSS:
  #   brand:
  #     primary: "#D9480F"
  #   style:
  #     extra: _static/extra.css
  # {nma-feedback} widgets post here (datatops). user_key is a write-only key
  # that is published in every notebook, so it is not a secret.
  feedback:
    url: https://pmyvdlilci.execute-api.us-east-1.amazonaws.com/klab
    project: neuromatch_cn
    user_key: y1x3mpx5
  # Scrolly pages (layout: scrolly) run Python in the browser with Pyodide,
  # loaded from here. The host must send CORS headers.
  scrolly:
    pyodide_url: https://cdn.jsdelivr.net/pyodide/v314.0.7/full/
