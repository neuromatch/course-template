name: Generate Notebooks

on:
  push:
    branches: [main]
    paths:
      - "tutorials/**"
      - "scripts/convert_to_notebooks.py"
      - "myst.yml"
      - "requirements.txt"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Convert tutorials to notebooks
        run: uv run python scripts/convert_to_notebooks.py

      - name: Commit generated notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notebooks/
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "chore: regenerate notebooks [skip ci]"
            git push
          fi
